[project]
name = "noisy-speech-pipeline"
version = "0.0.1"
description = "Robust ASR pipeline for kitchen-table recordings"
authors = [
    {name = "coolsnow7",email = "drogoff@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "noisy_speech_pipeline", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

