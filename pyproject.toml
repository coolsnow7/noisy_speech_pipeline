[project]
authors = [
    {name = "coolsnow7",email = "drogoff@gmail.com"}
]
description = "Robust ASR pipeline for kitchen-table recordings"
name = "noisy-speech-pipeline"
version = "0.0.1"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "soundfile (>=0.13.1,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "noisy_speech_pipeline", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
notebook = "^7.4.4"
nbconvert = "^7.16.6"
ipykernel = "^6.30.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.16"
tqdm = "^4.67.1"
polars = "^1.32.0"
soundfile = "^0.13.1"


[tool.poetry.group.docs.dependencies]
mkdocstrings = {extras = ["python"], version = "^0.29.1"}

