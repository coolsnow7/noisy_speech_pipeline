services:
  review_ui:
    build:
      context: ../..                 # <- repo root (two levels up from local/airflow)
      dockerfile: local/airflow/Dockerfile  # <- path is relative to context above
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir streamlit watchdog &&
      streamlit run scripts/review_triage.py
      --server.port=8501 --server.address=0.0.0.0 --server.runOnSave=true"
    ports:
      - "8501:8501"
    volumes:
      - ../..:/app                   # <- mount repo root so /app/data is visible
    environment:
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1