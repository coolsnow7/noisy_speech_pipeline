
services:
  airflow:
    build: 
      context: .
      dockerfile: Dockerfile
    command: ["bash","-lc","airflow standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      # mount repo's DAGs and data into the container
      - ../../airflow_dags:/opt/airflow/dags
      - ../../data:/opt/airflow/data
    ports:
      - "8080:8080"
  review_ui:
    build: .
    command: >
      bash -lc "poetry run streamlit run scripts/review_triage.py
      --server.port=8501 --server.address=0.0.0.0 --server.runOnSave=true"
    ports:
      - "8501:8501"
    volumes:
      - .:/app          # mount the whole repo into the container
      - ../../data:/app/data
    environment:
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      