name: CI (Python matrix)
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest -q --cov=noisy_speech_pipeline --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - run: poetry run pytest -q --cov=noisy_speech_pipeline --cov-report=xml
      - name: Upload coverage artifact
        if: ${{ matrix.python-version == '3.13' }}      # 👈 only once
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
