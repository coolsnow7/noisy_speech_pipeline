name: CI (Python matrix)
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    outputs:
      coverage_path: ${{ steps.cov.outputs.coverage_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest -q --cov=noisy_speech_pipeline --cov-report=xml
        id: cov
        # record the path for downstream job (works even if same for all)
        env:
          COVERAGE_PATH: coverage.xml
        continue-on-error: false

  # ── single uploader job depends on the 3.13 build ────────────────
  upload-coverage:
    needs: build
    if: ${{ needs.build.outputs.python-version == '3.13' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
