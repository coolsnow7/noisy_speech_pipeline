name: CI (Python matrix)
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]        # only one interpreter for now
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install poetry
      - run: poetry install

      # run tests + generate coverage.xml
      - run: poetry run pytest -q --cov=noisy_speech_pipeline --cov-report=xml

      # single upload step — no conflicts
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
